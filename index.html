<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="description" content="B.Tech Daily Timetable with Branch, Cluster & Section Selection"><link rel="manifest" href="manifest.json"><title>College Timetable</title>
<link rel="stylesheet" href="style.css"></head>
<body><main>
<div class="top">
  <div>
    <h1 id="title">Today's Timetable</h1>
    <div class="subtitle" id="subtitle">Select Branch, Cluster & Section</div>
  </div>
  <div class="today" id="todayBadge">Today</div>
</div>

<div class="selectors">
  <div class="select-group">
    <label for="branchSelect">Branch</label>
    <select id="branchSelect"></select>
  </div>
  <div class="select-group">
    <label for="clusterSelect">Cluster</label>
    <select id="clusterSelect"></select>
  </div>
  <div class="select-group">
    <label for="sectionSelect">Section</label>
    <select id="sectionSelect"></select>
  </div>
</div>

<div class="days" id="days" aria-label="Choose a day"></div>
<button type="button" class="today-jump" id="todayJump">↩ Back to Today</button>
<div class="status" id="status" aria-live="polite"><div class="status-main"><div><div class="status-label" id="statusLabel"></div><div class="status-title" id="statusTitle"></div></div><div class="countdown" id="countdown"></div></div></div>
<div class="date" id="dateLabel"></div>
<section class="classes" id="classes" aria-live="polite"></section>
<div class="footer">
  Based on the 3rd Semester 2026–27 timetable
  <br> Built by Navaneeth S (CSE)
  <!-- <a href="https://github.com/Navaneeth860/Timetable" target="_blank">
    GitHub
  </a> -->
</div>
</main>

<script>
let DATA = {};

const order = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const short = {Monday: "Mon", Tuesday: "Tue", Wednesday: "Wed", Thursday: "Thu", Friday: "Fri", Saturday: "Sat"};
const breaks = [["09:50", "10:20", "Tea Break"], ["01:05", "02:00", "Lunch Break"]];

let currentBranch = localStorage.getItem("timetable_branch") || "CSE";
let currentCluster = localStorage.getItem("timetable_cluster") || "B";
let currentSection = localStorage.getItem("timetable_section") || "3B1 [3D]";
let selectedDay;

const branchEl = document.getElementById("branchSelect");
const clusterEl = document.getElementById("clusterSelect");
const sectionEl = document.getElementById("sectionSelect");
const dayEl = document.getElementById("days");
const classesEl = document.getElementById("classes");
const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");
const dateEl = document.getElementById("dateLabel");
const badgeEl = document.getElementById("todayBadge");
const statusEl = document.getElementById("status");
const statusLabelEl = document.getElementById("statusLabel");
const statusTitleEl = document.getElementById("statusTitle");
const countdownEl = document.getElementById("countdown");
const todayJumpEl = document.getElementById("todayJump");

function initSelectors() {
  branchEl.innerHTML = "";
  const branches = Object.keys(DATA);
  branches.forEach(b => {
    const opt = document.createElement("option");
    opt.value = b;
    opt.textContent = b;
    if (b === currentBranch) opt.selected = true;
    branchEl.appendChild(opt);
  });
  if (!branches.includes(currentBranch) && branches.length > 0) {
    currentBranch = branches[0];
    localStorage.setItem("timetable_branch", currentBranch);
  }

  updateClusterOptions();
}

function updateClusterOptions() {
  clusterEl.innerHTML = "";
  const branchData = DATA[currentBranch] || {};

  if (currentBranch === "CSE") {
    const clusters = ["All","A", "B", "C", "D", "E"];
    clusters.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c === "All" ? "All Clusters" : `Cluster ${c}`;
      if (c === currentCluster) opt.selected = true;
      clusterEl.appendChild(opt);
    });
  } else {
    const opt = document.createElement("option");
    opt.value = "All";
    opt.textContent = "All Sections";
    opt.selected = true;
    clusterEl.appendChild(opt);
    currentCluster = "All";
  }

  updateSectionOptions();
}

function updateSectionOptions() {
  sectionEl.innerHTML = "";
  const branchData = DATA[currentBranch] || {};
  let sections = Object.keys(branchData);

  if (currentBranch === "CSE" && currentCluster !== "All") {
    sections = sections.filter(sec => sec.startsWith(`3${currentCluster}`));
  }

  sections.forEach(sec => {
    const opt = document.createElement("option");
    opt.value = sec;
    opt.textContent = sec;
    if (sec === currentSection) opt.selected = true;
    sectionEl.appendChild(opt);
  });

  if (!sections.includes(currentSection) && sections.length > 0) {
    currentSection = sections[0];
    localStorage.setItem("timetable_section", currentSection);
  }
}

branchEl.onchange = (e) => {
  currentBranch = e.target.value;
  localStorage.setItem("timetable_branch", currentBranch);
  updateClusterOptions();
  render(selectedDay || todayName());
};

clusterEl.onchange = (e) => {
  currentCluster = e.target.value;
  localStorage.setItem("timetable_cluster", currentCluster);
  updateSectionOptions();
  render(selectedDay || todayName());
};

sectionEl.onchange = (e) => {
  currentSection = e.target.value;
  localStorage.setItem("timetable_section", currentSection);
  render(selectedDay || todayName());
};

function todayName() { return new Intl.DateTimeFormat("en-IN", { weekday: "long" }).format(new Date()); }
function formatDate() { return new Intl.DateTimeFormat("en-IN", { day: "numeric", month: "short", year: "numeric" }).format(new Date()); }

function toMinutes(v) {
  if (!v) return 0;
  let str = String(v).trim().toUpperCase();
  let isPM = str.includes("PM");
  let isAM = str.includes("AM");
  str = str.replace("AM", "").replace("PM", "").trim();
  let parts = str.split(":");
  if (parts.length < 2) return 0;
  let h = parseInt(parts[0], 10);
  let m = parseInt(parts[1], 10);
  if (isNaN(h) || isNaN(m)) return 0;

  if (isPM && h < 12) h += 12;
  if (isAM && h === 12) h = 0;
  if (!isAM && !isPM && h <= 5) h += 12;

  return h * 60 + m;
}

function parseRange(t) {
  if (!t || !t.includes("–")) return [0, 0];
  const parts = t.split("–");
  if (parts.length < 2) return [0, 0];

  let startStr = parts[0].trim();
  let endStr = parts[1].trim();

  if (endStr.includes("AM") && !startStr.includes("AM") && !startStr.includes("PM")) {
    startStr += " AM";
  } else if (endStr.includes("PM") && !startStr.includes("AM") && !startStr.includes("PM")) {
    let startH = parseInt(startStr.split(":")[0], 10);
    if (startH === 12 || startH < 8) {
      startStr += " PM";
    } else {
      startStr += " AM";
    }
  }

  return [toMinutes(startStr), toMinutes(endStr)];
}

function isToday(d) { return d === todayName(); }
function nowMin() { const n = new Date(); return n.getHours() * 60 + n.getMinutes() + n.getSeconds() / 60; }

function getTimetable(d) {
  return DATA[currentBranch]?.[currentSection]?.[d] || null;
}

function liveIndex(list, d) {
  if (!isToday(d) || !list) return -1;
  const n = nowMin();
  return list.findIndex(item => {
    const [s, e] = parseRange(item.time);
    return s > 0 && n >= s && n < e;
  });
}

function nextIndex(list, d) {
  if (!isToday(d) || !list) return -1;
  const n = nowMin();
  return list.findIndex(item => {
    const [s] = parseRange(item.time);
    return s > n;
  });
}

function status(list, d) {
  if (!isToday(d) || !list || !list.length) return null;
  const n = nowMin();
  const li = liveIndex(list, d);
  if (li >= 0) {
    const item = list[li];
    return { kind: "live", label: "Live now", title: item.subject, target: parseRange(item.time)[1], prefix: "Ends in " };
  }
  const br = breaks.find(([s, e]) => n >= toMinutes(s) && n < toMinutes(e));
  if (br) return { kind: "break", label: br[2], title: "Enjoy your break", target: toMinutes(br[1]), prefix: "Ends in " };
  const ni = nextIndex(list, d);
  if (ni >= 0) {
    const item = list[ni];
    return { kind: "next", label: "Next class", title: item.subject, target: parseRange(item.time)[0], prefix: "Starts in " };
  }
  return { kind: "done", label: "Day complete", title: "No more classes today", target: null, prefix: "" };
}

function duration(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${s}s` : `${s}s`;
}

function updateStatus(list, d) {
  const x = status(list, d);
  if (!x) { statusEl.className = "status"; return; }
  statusEl.className = `status visible ${x.kind}`;
  statusLabelEl.textContent = x.label;
  statusTitleEl.textContent = x.title;
  countdownEl.textContent = x.target === null ? "✓" : x.prefix + duration((x.target - nowMin()) * 60);
}

function addBreak(b) {
  const [s, e, l] = b, i = document.createElement("div");
  i.className = "break-row";
  i.innerHTML = `<div class="time">${s}–${e}</div><div class="break-card">☕ ${l}</div>`;
  classesEl.appendChild(i);
}

function render(d, scroll = false) {
  selectedDay = d;
  const today = todayName();
  const viewToday = d === today;
  const list = getTimetable(d);
  
  subtitleEl.textContent = `${currentBranch} · ${currentSection}`;
  titleEl.textContent = viewToday ? "Today's Timetable" : d + " Timetable";

  const li = liveIndex(list, d);
  const ni = nextIndex(list, d);
  const st = status(list, d);

  badgeEl.textContent = li >= 0 ? "● LIVE NOW" : st?.kind === "break" ? "☕ BREAK" : viewToday ? "TODAY" : "VIEWING";
  badgeEl.classList.toggle("live-badge", li >= 0);
  badgeEl.classList.toggle("break-badge", li < 0 && st?.kind === "break");

  dateEl.textContent = viewToday ? formatDate() : "Tap a day above to switch";
  todayJumpEl.classList.toggle("visible", !viewToday);
  dayEl.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.day === d));
  classesEl.innerHTML = "";
  updateStatus(list, d);

  if (list === null) {
    classesEl.innerHTML = `
      <div class="empty">
        <div style="font-size:36px;margin-bottom:8px">🚀</div>
        <strong style="font-size:16px;color:var(--text)">Coming Soon!!</strong><br>
        <span style="font-size:12px;margin-top:6px;display:inline-block">Timetable data for ${currentBranch} - ${currentSection} will be updated shortly!</span>
      </div>`;
    return;
  }

  if (!list.length) {
    classesEl.innerHTML = `
      <div class="empty">
        <strong>No classes scheduled</strong><br>
        <span>Enjoy your day! 🎉</span>
      </div>`;
    return;
  }

  list.forEach((item, i) => {
    const t = item.time || "";
    const s = item.subject || "";
    const c = item.course_code || "";
    const r = item.venue || "";
    const tr = item.faculty || "";
    const typeStr = (item.type || "theory").toUpperCase();
    let grpStr = "";
    if (Array.isArray(item.groups)) {
      grpStr = item.groups.map(g => `${g.group}${g.faculty ? ' (' + g.faculty + ')' : ''}${g.venue ? ' @ ' + g.venue : ''}`).join(", ");
    } else {
      grpStr = item.groups || "";
    }

    const el = document.createElement("article");
    const live = i === li;
    const next = i === ni && li < 0;
    const [startMin, endMin] = parseRange(t);
    const done = viewToday && !live && endMin > 0 && endMin <= nowMin();

    el.className = `class${live ? " live" : ""}${done ? " done" : ""}`;

    const codeHtml = c ? `<div class="code">📘 ${c}</div>` : "";
    const roomHtml = r ? `<div class="code">📍 ${r}</div>` : "";
    const teacherHtml = tr ? `<div class="code">👨‍🏫 ${tr}</div>` : "";
    const groupHtml = grpStr ? `<div class="code" style="color:var(--accent);font-weight:700">👥 Groups: ${grpStr}</div>` : "";

    el.innerHTML = `
      <div class="time">${t}</div>
      <div class="card${live ? " live" : ""}${next ? " next" : ""}">
        <div class="subject">${s || "Class"}</div>
        ${codeHtml}
        ${roomHtml}
        ${teacherHtml}
        ${groupHtml}
        <span class="type">${typeStr}</span>
        ${live ? '<span class="live-pill"><span class="live-dot"></span>LIVE NOW</span>' : next ? '<span class="next-pill">NEXT</span>' : ""}
      </div>`;
    classesEl.appendChild(el);

    const end = endMin;
    const b = breaks.find(([bs]) => toMinutes(bs) === end);
    if (b) addBreak(b);
    if (i < list.length - 1) {
      const nextStart = parseRange(list[i + 1].time)[0];
      const gapBreak = breaks.find(([bs, be]) => toMinutes(bs) >= end && toMinutes(be) <= nextStart && !breaks.some(([pbs]) => toMinutes(pbs) === end));
      if (gapBreak) addBreak(gapBreak);
    }
  });

  if (scroll && li >= 0) {
    setTimeout(() => classesEl.children[li]?.scrollIntoView({ behavior: "smooth", block: "center" }), 150);
  }
}

fetch("./data.json")
  .then(res => res.json())
  .then(data => {
    DATA = data;
    initSelectors();

    order.forEach(d => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "day";
      b.dataset.day = d;
      b.textContent = short[d];
      if (d === todayName()) b.classList.add("today-day");
      b.onclick = () => render(d);
      dayEl.appendChild(b);
    });

    todayJumpEl.onclick = () => render(todayName(), true);

    const initial = order.includes(todayName()) ? todayName() : "Monday";
    render(initial, true);

    setInterval(() => {
      if (selectedDay === todayName()) render(selectedDay);
    }, 1000);
  })
  .catch(err => console.error("Failed to load timetable data:", err));
</script>
<script>
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
</body>
</html>
